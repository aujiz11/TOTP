name: Attach release packages

on:
  release:
    types: [published]
  workflow_run:
    workflows: ['Build development packages']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an already published release to attach packages to'
        required: true
        type: string

permissions: {}

jobs:
  attach:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout release automation from the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Attach matching Windows and Linux ZIPs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const attach = require('./.github/scripts/release-assets.js');
            await attach({ github, context, core });
